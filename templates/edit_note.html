<!DOCTYPE html>
<html lang="en">

<head>
    <title>Subscription Notes</title>

    <!-- Head -->
    {% include 'head.html' %}
</head>

<body>
    <!-- Navigation -->
    {% include 'header.html' %}

    <!-- Hero Section -->
    <main class="auth-page">
        <div class="auth-card subscription-details-card">
            <form action="{{ url_for('edit_note_post', subscription_id=subscription_detail['id']) }}" method="POST">
                {{ form.hidden_tag() }}

                <div class="edit-note-header">
                    <span class="edit-note-label">Editing note for</span>
                    <h1>{{ subscription_detail['service'] }}</h1>
                </div>

                 <div class="form-group">
                    {{ form.notes.label }}
                    {{ form.notes() }}
                </div>

                {{ form.submit() }}
            </form>
        </div>
    </main>

    <!-- Footer -->
    {% include 'footer.html' %}
</body>
</html>
